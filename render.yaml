services:
  - type: web
    name: dial-backend
    runtime: node
    rootDir: server
    plan: free
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: dial-db
          property: connectionString
      - key: DATABASE_SSL
        value: "true"
      - key: CORS_ORIGIN
        value: https://dial-frontend.onrender.com
      - key: OPENAI_BASE_URL
        value: https://api.openai.com/v1
      - key: MODEL
        value: gpt-5.6
      - key: OPENAI_API_KEY
        sync: false
      - key: SEED_ADMIN_PASSWORD
        sync: false

  - type: web
    name: dial-frontend
    runtime: static
    rootDir: client
    buildCommand: npm install --include=dev && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://dial-backend.onrender.com

databases:
  - name: dial-db
    plan: free
